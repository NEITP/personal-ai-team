version: 1

security:
  protect_secrets: true
  protect_env_files: true
  restrict_workspace: true
  scan_secret_content: true

approval:
  delete_files: required
  database_migration: required
  production_deployment: required
  git_push: required
  git_merge: required
  overwrite_existing_files: required

git:
  auto_commit: false
  auto_push: false
  auto_merge: false
  require_diff_review: true

cost:
  prefer_existing_context: true
  avoid_duplicate_requests: true
  prefer_free_tier: true
  use_local_models_when_available: true

execution:
  preserve_logs: true
  timeout_seconds: 900

logging:
  include_prompt: false
  include_raw_output: false
  include_diagnostics: false
  include_structured_result: false

context:
  show_loaded_files: true
  max_file_size_bytes: 60000
  max_total_characters: 100000
  blocked_file_patterns:
    - ".env"
    - ".env.*"
    - "*credential*"
    - "*secret*"
    - "id_rsa*"
    - "id_ed25519*"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - "*.ppk"
